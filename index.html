<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penerimaan Tamu - SMAN 1 Kandangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sekolah: {
                            navy: '#1e3a8a', 
                            gold: '#facc15', 
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<!-- Latar belakang diubah menjadi gradasi Biru (Biru Tua ke Biru Muda) lalu ke Putih -->
<body class="bg-gradient-to-br from-blue-800 via-blue-400 to-white min-h-screen flex items-center justify-center p-4 font-sans">

    <!-- Container Utama -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border-t-8 border-t-sekolah-navy overflow-hidden min-h-[550px] relative flex flex-col">
        
        <!-- HEADER GLOBAL (Pojok Atas) -->
        <div class="px-6 py-4 flex items-center gap-4 bg-white/90 backdrop-blur-sm border-b border-slate-100 z-10 relative shadow-sm">
            <!-- Logo Sekolah -->
            <img src="logo saka.jfif" alt="Logo SMAN 1 Kandangan" class="w-11 h-11 object-contain drop-shadow-sm">
            <!-- Teks Nama Sekolah -->
            <div class="flex flex-col">
                <h1 class="font-extrabold text-sekolah-navy text-base md:text-lg leading-tight uppercase tracking-wide">SMAN 1 Kandangan</h1>
                <span class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">Portal Buku Tamu</span>
            </div>
        </div>

        <!-- HALAMAN LOGIN (Tampilan Default untuk di-Screenshot) -->
        <div id="login-page" class="p-8 animate-fade-in flex-1 flex flex-col justify-center">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Selamat Datang</h2>
                <p class="text-slate-500 text-sm mt-1">Silakan masuk untuk mencatat kunjungan</p>
            </div>
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ID Petugas / Email</label>
                    <input type="text" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50" placeholder="Masukkan ID" readonly>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Sandi</label>
                    <input type="password" class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50" placeholder="••••••••" readonly>
                </div>
                <button type="button" class="w-full bg-sekolah-navy text-white font-bold py-3.5 rounded-xl shadow-md mt-2">
                    Masuk ke Sistem
                </button>
            </form>
        </div>

    </div>

</body>
</html>
