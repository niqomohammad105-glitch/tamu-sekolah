<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penerimaan Tamu - SMAN 1 Kandangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sekolah: { navy: '#1e3a8a', gold: '#facc15' }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                    }
                }
            }
        }
    </script>
    
    <style>
        .barcode {
            font-family: 'Libre Barcode 39', monospace;
            letter-spacing: 2px;
            background: repeating-linear-gradient(90deg, #000, #000 2px, #fff 2px, #fff 4px, #000 4px, #000 5px, #fff 5px, #fff 8px);
            height: 24px; width: 80%; margin: 0 auto;
        }
        @media print {
            body { background: white !important; }
            body * { visibility: hidden; }
            #print-page, #print-page * { visibility: visible; }
            #print-page { position: absolute; left: 0; top: 0; width: 100%; display: flex; justify-content: center; padding-top: 20px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-800 via-blue-400 to-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border-t-8 border-t-sekolah-navy overflow-hidden min-h-[600px] relative flex flex-col">
        
        <!-- HEADER -->
        <div class="px-6 py-4 flex items-center gap-4 bg-white/90 backdrop-blur-sm border-b border-slate-100 no-print z-10 relative shadow-sm">
            <img src="logo saka.jfif" alt="Logo" class="w-11 h-11 object-contain drop-shadow-sm">
            <div class="flex flex-col">
                <h1 class="font-extrabold text-sekolah-navy text-base md:text-lg leading-tight uppercase tracking-wide">SMAN 1 Kandangan</h1>
                <span class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">Portal Buku Tamu</span>
            </div>
        </div>

        <!-- 1. LOGIN -->
        <div id="login-page" class="p-8 animate-fade-in flex-1 flex flex-col justify-center block">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Selamat Datang</h2>
                <p class="text-slate-500 text-sm mt-1">Silakan masuk untuk mencatat kunjungan</p>
            </div>
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ID Petugas</label>
                    <input type="text" required class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white" placeholder="Masukkan ID">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Sandi</label>
                    <input type="password" required class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-50 focus:bg-white" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-sekolah-navy text-white font-bold py-3.5 rounded-xl shadow-md mt-2">
                    Masuk ke Sistem
                </button>
            </form>
        </div>

        <!-- 2. KAMERA -->
        <div id="camera-page" class="p-8 hidden flex-col flex-1 animate-fade-in">
            <div class="text-center mb-4">
                <h2 class="text-xl font-bold text-slate-900">Verifikasi Wajah</h2>
            </div>
            <div class="relative bg-slate-900 rounded-2xl overflow-hidden w-full aspect-square mb-6 flex justify-center items-center">
                <video id="video-feed" autoplay playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
                <canvas id="photo-canvas" class="hidden w-full h-full object-cover transform scale-x-[-1]"></canvas>
            </div>
            <div class="flex flex-col gap-3 mt-auto">
                <button id="btn-capture" type="button" class="w-full bg-sekolah-navy text-white font-bold py-3.5 rounded-xl shadow-md">Ambil Foto</button>
                <div class="flex gap-2">
                    <button id="btn-retake" type="button" class="w-1/3 bg-slate-200 text-slate-700 font-bold py-3 rounded-xl hidden">Ulangi</button>
                    <button id="btn-next-form" type="button" class="w-2/3 bg-sekolah-gold text-slate-900 font-bold py-3 rounded-xl hidden">Isi Data Tamu</button>
                </div>
            </div>
        </div>

        <!-- 3. FORMULIR -->
        <div id="form-page" class="p-8 hidden flex-1 flex-col animate-fade-in overflow-y-auto max-h-[500px]">
            <h2 class="text-xl font-bold text-slate-900 mb-5 border-b-2 pb-3">Registrasi Tamu</h2>
            <form id="guest-form" class="space-y-4 flex-1 pb-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Lengkap Tamu</label>
                    <input type="text" id="input-nama" required class="w-full px-4 py-2 border border-slate-300 rounded-lg" placeholder="Masukkan nama tamu">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Keperluan di Sekolah</label>
                    <input type="text" id="input-tujuan" required class="w-full px-4 py-2 border border-slate-300 rounded-lg" placeholder="Contoh: Rapat Komite, Mengantar Berkas">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Pihak yang Dituju</label>
                    <input type="text" id="input-dituju" required class="w-full px-4 py-2 border border-slate-300 rounded-lg" placeholder="Contoh: Bpk. Budi">
                </div>
                
                <!-- INPUT MANUAL UNTUK TANGGAL DAN WAKTU -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Tanggal Hadir</label>
                        <input type="date" id="input-tanggal" required class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Waktu Datang</label>
                        <input type="time" id="input-waktu" required class="w-full px-3 py-2 border border-slate-300 rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Berlaku Sampai Jam</label>
                    <input type="time" id="input-jam-selesai" required class="w-full px-4 py-2 border border-slate-300 rounded-lg text-red-600 font-bold">
                </div>

                <button type="submit" class="w-full bg-sekolah-navy text-white font-bold py-3.5 rounded-xl mt-4">Simpan & Terbitkan ID</button>
            </form>
        </div>

        <!-- 4. CETAK KARTU -->
        <div id="print-page" class="p-8 hidden flex-1 flex-col items-center animate-fade-in">
            <div class="w-[260px] bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-xl relative" style="print-color-adjust: exact; -webkit-print-color-adjust: exact;">
                <div class="bg-sekolah-navy h-20 w-full relative">
                    <div class="absolute bottom-0 w-full h-2 bg-sekolah-gold"></div>
                    
                    <!-- LOGO DI POJOK KIRI ATAS KARTU -->
                    <div class="absolute top-2 left-2 flex flex-col items-center z-10">
                        <img src="logo saka.jfif" alt="Logo" class="w-7 h-7 object-contain drop-shadow-md bg-white rounded-full p-[1px]">
                        <span class="text-white font-bold text-[6px] mt-1 tracking-widest text-center uppercase leading-none drop-shadow-sm">SMAN 1<br>Kandangan</span>
                    </div>

                    <div class="absolute -bottom-10 left-1/2 transform -translate-x-1/2 w-20 h-20 bg-white rounded-full border-4 border-white shadow-sm flex items-center justify-center z-10 overflow-hidden">
                        <img id="card-photo" src="" alt="Foto" class="w-full h-full object-cover">
                    </div>
                </div>
                
                <div class="pt-12 pb-4 px-4 text-center mt-2 relative z-0">
                    <h3 class="font-black text-slate-900 tracking-wider text-xl uppercase">VISITOR</h3>
                    <div class="bg-slate-50 rounded-lg p-2 mb-3 border border-slate-100">
                        <p id="card-nama" class="font-bold text-slate-800 text-sm truncate uppercase">NAMA TAMU</p>
                    </div>
                    
                    <!-- RINCIAN DATA -->
                    <div class="text-left space-y-1.5 px-2">
                        <div>
                            <p class="text-[9px] text-slate-400 font-bold uppercase">Keperluan:</p>
                            <p id="card-tujuan" class="text-xs font-semibold text-sekolah-navy leading-tight line-clamp-2">Keperluan Kunjungan</p>
                        </div>
                        <div>
                            <p class="text-[9px] text-slate-400 font-bold uppercase">Menemui:</p>
                            <p id="card-dituju" class="text-xs font-semibold text-slate-700 leading-tight">Nama Dituju</p>
                        </div>
                        <div class="mt-2 bg-red-50 border border-red-200 rounded p-1.5 text-center">
                            <p class="text-[9px] text-red-600 font-bold uppercase">Batas Kunjungan:</p>
                            <p id="card-batas-waktu" class="text-xs font-black text-red-700 tracking-wider">00:00 WIB</p>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-100 px-4 py-3 text-center border-t border-slate-200">
                    <div class="barcode mb-1"></div>
                    <p id="card-tanggal" class="text-[8px] font-mono text-slate-500 font-bold uppercase tracking-wide">TGL - WAKTU</p>
                </div>
            </div>
            
            <div class="w-full flex gap-3 mt-8 no-print">
                <button onclick="window.print()" type="button" class="w-full bg-sekolah-navy text-white font-bold py-3.5 rounded-xl">Cetak ID</button>
                <button onclick="location.reload()" type="button" class="w-full bg-slate-200 text-slate-800 font-bold py-3.5 rounded-xl">Selesai</button>
            </div>
        </div>

    </div>

    <script>
        const pages = { login: document.getElementById('login-page'), camera: document.getElementById('camera-page'), form: document.getElementById('form-page'), print: document.getElementById('print-page') };
        function showPage(pageName) {
            Object.values(pages).forEach(page => { page.classList.remove('block', 'hidden', 'flex'); page.classList.add('hidden'); });
            pages[pageName].classList.remove('hidden'); pages[pageName].classList.add(pageName === 'login' ? 'block' : 'flex');
        }

        document.getElementById('login-form').addEventListener('submit', (e) => { e.preventDefault(); showPage('camera'); initCamera(); });

        const video = document.getElementById('video-feed'), canvas = document.getElementById('photo-canvas');
        const btnCapture = document.getElementById('btn-capture'), btnRetake = document.getElementById('btn-retake'), btnNextForm = document.getElementById('btn-next-form');
        let stream, photoDataUrl = '';

        async function initCamera() {
            try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }); video.srcObject = stream; } 
            catch (err) { alert("Izinkan akses kamera di browser Anda!"); }
        }
        function stopCamera() { if (stream) stream.getTracks().forEach(track => track.stop()); }

        btnCapture.addEventListener('click', () => {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext('2d').drawImage(video, 0, 0);
            photoDataUrl = canvas.toDataURL('image/jpeg');
            video.classList.add('hidden'); canvas.classList.remove('hidden');
            btnCapture.classList.add('hidden'); btnRetake.classList.remove('hidden'); btnNextForm.classList.remove('hidden');
        });
        btnRetake.addEventListener('click', () => {
            video.classList.remove('hidden'); canvas.classList.add('hidden');
            btnCapture.classList.remove('hidden'); btnRetake.classList.add('hidden'); btnNextForm.classList.add('hidden'); photoDataUrl = '';
        });
        btnNextForm.addEventListener('click', () => { stopCamera(); showPage('form'); });

        document.getElementById('guest-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const nama = document.getElementById('input-nama').value;
            const tujuan = document.getElementById('input-tujuan').value;
            const dituju = document.getElementById('input-dituju').value;
            
            // Mengambil input tanggal dan waktu secara manual dari form
            const tanggalInput = document.getElementById('input-tanggal').value;
            const waktuDatang = document.getElementById('input-waktu').value;
            const batasWaktu = document.getElementById('input-jam-selesai').value;

            // Memanipulasi teks hari dan tanggal menggunakan JavaScript Object Date
            const dateObj = new Date(tanggalInput);
            const opsiFormat = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const tanggalFormat = dateObj.toLocaleDateString('id-ID', opsiFormat);

            document.getElementById('card-photo').src = photoDataUrl;
            document.getElementById('card-nama').textContent = nama;
            document.getElementById('card-tujuan').textContent = tujuan;
            document.getElementById('card-dituju').textContent = dituju;
            
            document.getElementById('card-batas-waktu').textContent = `${batasWaktu} WIB`;
            // Tanggal dan waktu yang dicetak disesuaikan dengan input manual
            document.getElementById('card-tanggal').textContent = `${tanggalFormat} | MASUK: ${waktuDatang} WIB`;
            
            showPage('print');
        });
    </script>
</body>
</html>
