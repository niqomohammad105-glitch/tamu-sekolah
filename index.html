<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Penerimaan Tamu Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Gaya khusus untuk mode cetak (Print) */
        @media print {
            body * {
                visibility: hidden;
            }
            #print-page, #print-page * {
                visibility: visible;
            }
            #print-page {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                box-shadow: none;
                border: none;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Container Utama Aplikasi -->
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200 overflow-hidden min-h-[500px] relative">
        
        <!-- ==================== 1. HALAMAN LOGIN ==================== -->
        <div id="login-page" class="p-8 block">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-slate-900">Portal Resepsionis</h1>
                <p class="text-slate-500 text-sm mt-1">Sistem Penerimaan Tamu Sekolah</p>
            </div>
            <form id="login-form" class="space-y-5">
                <!-- [SECURITY AUDIT POINT]: Autentikasi sebenarnya harus divalidasi dengan API Backend -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username / Email</label>
                    <input type="text" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan username">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors">
                    Masuk
                </button>
            </form>
        </div>

        <!-- ==================== 2. HALAMAN KAMERA ==================== -->
        <div id="camera-page" class="p-8 hidden flex-col h-full">
            <h2 class="text-xl font-bold text-slate-900 mb-2">Ambil Foto Wajah</h2>
            <p class="text-sm text-slate-500 mb-4">Pastikan wajah tamu terlihat jelas di dalam bingkai.</p>
            
            <div class="relative bg-slate-900 rounded-lg overflow-hidden w-full aspect-square mb-4 flex items-center justify-center">
                <video id="video-feed" autoplay playsinline class="w-full h-full object-cover"></video>
                <canvas id="photo-canvas" class="hidden w-full h-full object-cover"></canvas>
            </div>

            <!-- [SECURITY AUDIT POINT]: Tangani fallback jika izin kamera ditolak (Permission Denied) -->
            <div class="flex gap-2">
                <button id="btn-capture" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors">
                    Ambil Foto
                </button>
                <button id="btn-retake" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-medium py-2.5 rounded-lg transition-colors hidden">
                    Ulangi
                </button>
            </div>
            <button id="btn-next-form" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 rounded-lg transition-colors mt-2 hidden">
                Lanjutkan Isi Form
            </button>
        </div>

        <!-- ==================== 3. HALAMAN FORMULIR ==================== -->
        <div id="form-page" class="p-8 hidden">
            <h2 class="text-xl font-bold text-slate-900 mb-4">Data Kunjungan</h2>
            <form id="guest-form" class="space-y-4">
                <!-- [SECURITY AUDIT POINT]: Wajib sanitasi input dari serangan XSS (Cross-Site Scripting) sebelum disimpan ke Database -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="input-nama" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Tujuan Kunjungan</label>
                    <select id="input-tujuan" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="">Pilih Tujuan...</option>
                        <option value="Bertemu Siswa">Bertemu Siswa</option>
                        <option value="Bertemu Guru/Staf">Bertemu Guru/Staf</option>
                        <option value="Rapat/Dinas">Rapat / Dinas</option>
                        <option value="Pengiriman Barang">Pengiriman Barang</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Pihak yang Dituju</label>
                    <input type="text" id="input-dituju" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Nama Guru/Staf/Siswa">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors mt-6">
                    Simpan & Buat Kartu
                </button>
            </form>
        </div>

        <!-- ==================== 4. HALAMAN CETAK KARTU ==================== -->
        <div id="print-page" class="p-8 hidden flex-col items-center">
            <h2 class="text-xl font-bold text-slate-900 mb-6 no-print">Pratinjau Kartu Pengunjung</h2>
            
            <!-- Desain ID Card -->
            <div class="w-72 bg-white border-2 border-slate-800 rounded-xl overflow-hidden shadow-sm relative">
                <div class="bg-slate-800 text-white text-center py-3">
                    <h3 class="font-bold text-lg">VISITOR / TAMU</h3>
                    <p class="text-xs">Sekolah Menengah Terpadu</p>
                </div>
                <div class="p-4 flex flex-col items-center">
                    <img id="card-photo" src="" alt="Foto Tamu" class="w-24 h-24 object-cover rounded-md border-2 border-slate-200 mb-4 bg-slate-100">
                    <div class="w-full text-center space-y-1">
                        <p id="card-nama" class="font-bold text-lg text-slate-900 uppercase">NAMA TAMU</p>
                        <p id="card-tujuan" class="text-sm font-medium text-blue-700">Tujuan Kunjungan</p>
                        <p class="text-xs text-slate-500 mt-2">Menemui:</p>
                        <p id="card-dituju" class="text-sm font-medium text-slate-800">Nama Pihak Dituju</p>
                    </div>
                </div>
                <div class="bg-slate-100 text-center py-2 border-t border-slate-200">
                    <p id="card-tanggal" class="text-xs font-mono text-slate-600">DD/MM/YYYY - HH:MM</p>
                </div>
            </div>

            <div class="w-full flex gap-2 mt-8 no-print">
                <button onclick="window.print()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Cetak Kartu
                </button>
                <button onclick="location.reload()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-medium py-2.5 rounded-lg transition-colors">
                    Selesai
                </button>
            </div>
        </div>

    </div>

    <!-- Script Logika UI -->
    <script>
        // DOM Elements
        const pages = {
            login: document.getElementById('login-page'),
            camera: document.getElementById('camera-page'),
            form: document.getElementById('form-page'),
            print: document.getElementById('print-page')
        };
        
        // Fungsi Pindah Halaman
        function showPage(pageName) {
            Object.values(pages).forEach(page => {
                page.classList.remove('block', 'hidden');
                page.classList.add('hidden');
            });
            pages[pageName].classList.remove('hidden');
            pages[pageName].classList.add(pageName === 'camera' || pageName === 'print' ? 'flex' : 'block');
        }

        // ================= 1. Logika Login =================
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Bypass login di UI untuk demontrasi
            showPage('camera');
            initCamera();
        });

        // ================= 2. Logika Kamera =================
        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('photo-canvas');
        const btnCapture = document.getElementById('btn-capture');
        const btnRetake = document.getElementById('btn-retake');
        const btnNextForm = document.getElementById('btn-next-form');
        let stream;
        let photoDataUrl = '';

        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
            } catch (err) {
                alert("Gagal mengakses kamera. Mohon izinkan akses kamera pada browser Anda.");
                console.error("Camera Error:", err);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }

        btnCapture.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            photoDataUrl = canvas.toDataURL('image/jpeg');
            
            video.classList.add('hidden');
            canvas.classList.remove('hidden');
            
            btnCapture.classList.add('hidden');
            btnRetake.classList.remove('hidden');
            btnNextForm.classList.remove('hidden');
        });

        btnRetake.addEventListener('click', () => {
            video.classList.remove('hidden');
            canvas.classList.add('hidden');
            
            btnCapture.classList.remove('hidden');
            btnRetake.classList.add('hidden');
            btnNextForm.classList.add('hidden');
            photoDataUrl = '';
        });

        btnNextForm.addEventListener('click', () => {
            stopCamera();
            showPage('form');
        });

        // ================= 3. Logika Form & Render Kartu =================
        document.getElementById('guest-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Ambil Data
            const nama = document.getElementById('input-nama').value;
            const tujuan = document.getElementById('input-tujuan').value;
            const dituju = document.getElementById('input-dituju').value;
            
            // Format Tanggal Real-time
            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day:'2-digit', month:'2-digit', year:'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });

            // Masukkan data ke Kartu ID
            document.getElementById('card-photo').src = photoDataUrl;
            document.getElementById('card-nama').textContent = nama;
            document.getElementById('card-tujuan').textContent = tujuan;
            document.getElementById('card-dituju').textContent = dituju;
            document.getElementById('card-tanggal').textContent = `${dateStr} - ${timeStr}`;

            showPage('print');
        });
    </script>
</body>
</html>
