<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - SMAN 1 Kandangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { sekolah: { navy: '#1e3a8a', gold: '#facc15', dark: '#11285e' } } } }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @font-face { font-family: 'Childer'; src: url('Childer.otf') format('opentype'); font-weight: normal; font-style: normal; }
        .font-custom-title { font-family: 'Childer', sans-serif; letter-spacing: 2px; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased h-screen flex flex-col overflow-hidden selection:bg-sekolah-gold selection:text-sekolah-navy">

    <!-- HEADER ADMIN -->
    <div class="bg-white border-b border-slate-200 px-6 lg:px-10 py-5 flex justify-between items-center shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-sekolah-navy rounded-xl flex items-center justify-center shadow-md">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            </div>
            <div>
                <h2 class="text-xl lg:text-2xl font-black text-sekolah-navy">Sistem Pengawasan Terpusat</h2>
                <p class="text-xs lg:text-sm text-slate-500 font-bold tracking-wide" id="adminTanggal">Memuat tanggal...</p>
            </div>
        </div>
        <a href="index.html" class="px-5 py-3 bg-red-50 hover:bg-red-500 hover:text-white text-red-600 font-bold text-sm rounded-xl transition-all flex items-center gap-2 shadow-sm active:scale-95">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg> 
            Keluar Admin
        </a>
    </div>
    
    <!-- AREA TABEL -->
    <div class="p-6 lg:p-10 flex-1 overflow-y-auto">
        <div class="bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden max-w-7xl mx-auto">
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left min-w-[900px]">
                    <thead class="text-xs text-slate-500 uppercase bg-slate-50 border-b-2 border-slate-200">
                        <tr>
                            <th class="px-8 py-5 font-black tracking-wider">Identitas Tamu</th>
                            <th class="px-8 py-5 font-black tracking-wider">Keperluan & Tujuan</th>
                            <th class="px-8 py-5 font-black tracking-wider">Log Waktu</th>
                            <th class="px-8 py-5 font-black tracking-wider text-center">Status</th>
                            <th class="px-8 py-5 font-black tracking-wider text-right">Otorisasi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelAdmin" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="px-8 py-16 text-center text-slate-400 font-bold animate-pulse text-lg">Menghubungkan ke Database...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- LOGIKA DATABASE ADMIN -->
    <script>
        const SUPABASE_URL = 'https://jsyumznqizpcdfrandhh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzeXVtem5xaXpwY2RmcmFuZGhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTI3OTQsImV4cCI6MjEwNTI4ODc5NH0.K5_OsvlUkQHr2j_1FtkEx0PPUcBXL5hsjBbwjZHsX4U';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('adminTanggal').textContent = new Date().toLocaleDateString('id-ID', options);
            fetchDataAdmin();
            setInterval(fetchDataAdmin, 10000); 
        });

        async function fetchDataAdmin() {
            try {
                const { data, error } = await _supabase.from('tamu').select('*').order('id', { ascending: false });
                
                const tbody = document.getElementById('tabelAdmin');
                
                if (error) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-8 py-10 text-center text-red-600 font-black text-lg">Error Database: ${error.message}</td></tr>`;
                    return;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="px-8 py-16 text-center text-slate-500 font-bold">Belum ada tamu terdaftar.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                renderTabelHTML(data, tbody);
            } catch (error) {
                document.getElementById('tabelAdmin').innerHTML = `<tr><td colspan="5" class="px-8 py-10 text-center text-red-600 font-bold">Koneksi terputus.</td></tr>`;
            }
        }

        function renderTabelHTML(dataArray, tbody) {
            dataArray.forEach((item) => {
                const isSelesai = item.status === 'Selesai';
                const rowHtml = `
                    <tr class="hover:bg-blue-50/50 transition-colors ${isSelesai ? 'opacity-60 bg-slate-50 grayscale-[30%]' : ''}">
                        <td class="px-8 py-5">
                            <div class="flex items-center gap-4">
                                <img src="${item.foto_url && item.foto_url.length > 50 ? item.foto_url : `https://ui-avatars.com/api/?name=${encodeURIComponent(item.nama)}&background=1e3a8a&color=fff`}" class="w-12 h-12 rounded-full object-cover shadow-sm border-2 border-white">
                                <div>
                                    <p class="font-black text-slate-800 text-base">${item.nama}</p>
                                    <p class="text-xs text-slate-500 font-mono tracking-widest mt-0.5">VST-${item.id}</p>
                                </div>
                            </div>
                        </td>
                        <td class="px-8 py-5">
                            <p class="font-bold text-slate-700">${item.tujuan}</p>
                            <p class="text-xs text-slate-500 font-medium mt-1">Menemui: <span class="font-bold text-slate-600">${item.dituju}</span></p>
                        </td>
                        <td class="px-8 py-5">
                            <div class="flex flex-col gap-1.5 text-xs font-bold text-slate-600">
                                <div><span class="text-green-500 mr-2 tracking-wider">IN:</span>${item.waktu_masuk}</div>
                                <div><span class="text-red-500 mr-2 tracking-wider">OUT:</span>${item.batas_waktu}</div>
                            </div>
                        </td>
                        <td class="px-8 py-5 text-center">
                            <span class="inline-flex items-center px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-wider ${isSelesai ? 'bg-slate-200 text-slate-500' : 'bg-green-100 text-green-700 shadow-sm'}">
                                ${!isSelesai ? '<span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse mr-2"></span>' : ''}
                                ${isSelesai ? 'Selesai' : 'Di Dalam Area'}
                            </span>
                        </td>
                        <td class="px-8 py-5 text-right">
                            ${!isSelesai ? 
                            `<button onclick="selesaikanKunjunganDB('${item.id}', this)" class="px-5 py-2.5 bg-sekolah-navy text-white font-bold text-xs rounded-xl hover:bg-blue-800 transition-all shadow-md active:scale-95">Selesaikan</button>` 
                            : 
                            `<button disabled class="px-5 py-2.5 bg-slate-100 text-slate-400 font-bold text-xs rounded-xl cursor-not-allowed border-2 border-transparent">Selesai</button>`}
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', rowHtml);
            });
        }

        async function selesaikanKunjunganDB(id, btnElement) {
            btnElement.innerHTML = "Memproses...";
            btnElement.disabled = true;
            try {
                const { error } = await _supabase.from('tamu').update({ status: 'Selesai' }).eq('id', id);
                if (error) throw error;
                fetchDataAdmin(); 
            } catch (error) {
                alert("Gagal memperbarui status.");
                btnElement.innerHTML = "Selesaikan";
                btnElement.disabled = false;
            }
        }
    </script>
</body>
                        </html>
